aid: tecost-sa
name: Tecost SA
description: >-
  Tecost SA is a Swiss health-information-technology company, founded in 1997 and
  based in Fribourg, that designs, develops, implements, hosts and operates
  clinical information systems for hospitals, clinics, psychiatric and
  rehabilitation institutions, long-term care facilities and home-care
  organizations across French- and German-speaking Switzerland. Its product line
  is the Carefolio suite — Acute, Rehabilitation, Psy, LongTerm, AtHome, Critical
  Care 3C, Network, Portal, Workshop, AI and the openEHR-based Carefolio DIH Data
  Integration Hub — alongside consulting, change management, custom development,
  24/7 maintenance and SaaS operations. Tecost is a named industry partner of the
  openEHR Foundation and states that it is making openEHR the cornerstone of its
  clinical-data interoperability. It publishes no public developer portal, API
  reference or machine-readable contract; Carefolio is delivered as per-customer
  tenants behind Microsoft Entra ID single sign-on, so any integration contract
  reaches integrators under a commercial agreement rather than through a public
  surface.
