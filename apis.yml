  state: gated
  reason: customer-only-docs
  detail: >-
    Tecost markets an openEHR-based Data Integration Hub plus HL7 and SOAP
    integration for the Carefolio suite, but every Carefolio host is
    customer-only — www.carefolio.ch answers nginx 403 to anonymous requests and
    tenant hosts such as daler.carefolio.ch redirect to a Microsoft Entra ID
    SAML sign-in — so no reference, WSDL or openEHR artifact is reachable
    without an active institutional tenant.
